name: assetflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: backend/src/AssetFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      DatabaseProvider: "SqlServer"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=AssetFlow;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "AssetFlow"
      Jwt__Audience: "AssetFlowClient"
      Jwt__Key: "compose-dev-only-signing-key-use-a-secret-manager-in-prod-1a2b3c"
      Jwt__AccessTokenMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:8081"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  mssql-data:
